name: Beacon .NET Published Release Validation

on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  msi-installer:
    name: MSI installer on ${{ matrix.machine }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-2022, windows-2025]
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Download, verify, and validate MSI
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $asset = "beacon-dotnet-$version-windows-x64.msi"
          $msi = Join-Path $env:RUNNER_TEMP $asset
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern $asset --dir $env:RUNNER_TEMP
          gh attestation verify $msi `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/beacon-release.yml" `
            --source-ref "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Artifact attestation verification failed." }
          ./packaging/windows/test-msi.ps1 -MsiPath $msi

  powershell-installer:
    name: PowerShell installer on ${{ matrix.machine }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        machine: [windows-2022, windows-2025]
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install and run with the published PowerShell module
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          New-Item -ItemType Directory -Path testapp | Out-Null
          Set-Location testapp
          Set-Content Directory.Build.props '<Project />'
          dotnet new console --framework net8.0
          dotnet publish --framework net8.0 --configuration Release

          $modulePath = Join-Path $env:RUNNER_TEMP "OpenTelemetry.DotNet.Auto.psm1"
          $moduleUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/OpenTelemetry.DotNet.Auto.psm1"
          Invoke-WebRequest -Uri $moduleUrl -OutFile $modulePath
          gh attestation verify $modulePath `
            --repo $env:GITHUB_REPOSITORY `
            --signer-workflow "$env:GITHUB_REPOSITORY/.github/workflows/beacon-release.yml" `
            --source-ref "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw "Artifact attestation verification failed." }

          Import-Module $modulePath
          $installDirectory = Join-Path $env:RUNNER_TEMP "beacon-dotnet-auto"
          Install-OpenTelemetryCore -InstallDir $installDirectory -RegisterAssembliesInGAC $false -ErrorAction Stop
          Register-OpenTelemetryForCurrentSession -OTelServiceName "beacon-release-validation"
          ./bin/Release/net8.0/publish/testapp.exe
          if (-not $?) { throw "Instrumented application failed with exit code $LASTEXITCODE." }
          if (-not (Test-Path (Join-Path $installDirectory "BEACON-METADATA.json"))) { throw "Beacon metadata is missing." }
          $uninstallPath = Join-Path $installDirectory "uninstall.ps1"
          if (-not (Test-Path -LiteralPath $uninstallPath)) { throw "Standalone uninstaller is missing." }
          & $uninstallPath
          if (Test-Path -LiteralPath $installDirectory) {
            throw "Installation directory still exists after uninstall: $installDirectory"
          }
          if ([System.Environment]::GetEnvironmentVariable("OTEL_DOTNET_AUTO_INSTALL_DIR", [System.EnvironmentVariableTarget]::Machine)) {
            throw "Installation locator environment variable still exists after uninstall."
          }

  deb-installer:
    name: DEB installer on ${{ matrix.machine }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-22.04
            architecture: amd64
          - machine: ubuntu-22.04-arm
            architecture: arm64
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet
      - name: Download, verify, install, run, and uninstall DEB
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="beacon-dotnet-${version}-linux-${PACKAGE_ARCHITECTURE}.deb"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset}" --dir "${RUNNER_TEMP}"
          gh attestation verify "${RUNNER_TEMP}/${asset}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/beacon-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}"
          sudo dpkg --install "${RUNNER_TEMP}/${asset}"
          beacon-dotnet status
          OTEL_TRACES_EXPORTER=none \
            OTEL_METRICS_EXPORTER=none \
            OTEL_LOGS_EXPORTER=none \
            beacon-dotnet run dotnet --info
          beacon-dotnet uninstall
          test ! -e /opt/beacon/dotnet

  rpm-installer:
    name: RPM installer on ${{ matrix.machine }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-24.04
            architecture: x86_64
          - machine: ubuntu-24.04-arm
            architecture: aarch64
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - name: Download and verify RPM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          asset="beacon-dotnet-${version}-linux-${PACKAGE_ARCHITECTURE}.rpm"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset}" --dir "${RUNNER_TEMP}"
          gh attestation verify "${RUNNER_TEMP}/${asset}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/beacon-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}"
          mkdir -p "${RUNNER_TEMP}/beacon-rpm"
          cp "${RUNNER_TEMP}/${asset}" "${RUNNER_TEMP}/beacon-rpm/beacon-dotnet.rpm"
      - name: Validate RPM lifecycle in Rocky Linux
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${RUNNER_TEMP}/beacon-rpm:/release:ro" \
            rockylinux:9 /bin/bash -c '
              set -euo pipefail
              rpm --install /release/beacon-dotnet.rpm
              beacon-dotnet status
              beacon-dotnet uninstall
              test ! -e /opt/beacon/dotnet
            '

  unix-installer:
    name: Shell installer on ${{ matrix.machine }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-22.04
          - machine: ubuntu-22.04-arm
          - machine: macos-14
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup .NET
        uses: ./.github/actions/setup-dotnet

      - name: Install macOS coreutils
        if: runner.os == 'macOS'
        run: brew install coreutils

      - name: Install and run with the published shell installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          mkdir testapp
          cd testapp
          printf '%s\n' '<Project />' > Directory.Build.props
          dotnet new console --framework net8.0
          dotnet publish --framework net8.0 --configuration Release

          installer="${RUNNER_TEMP}/otel-dotnet-auto-install.sh"
          curl -sSfL \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/otel-dotnet-auto-install.sh" \
            -o "${installer}"
          gh attestation verify "${installer}" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/beacon-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}"

          install_directory="${RUNNER_TEMP}/beacon-dotnet-auto"
          log_directory="${RUNNER_TEMP}/beacon-dotnet-auto-logs"
          mkdir -p "${log_directory}"
          VERSION="${RELEASE_TAG}" OTEL_DOTNET_AUTO_HOME="${install_directory}" sh "${installer}"
          test -f "${install_directory}/BEACON-METADATA.json"
          OTEL_DOTNET_AUTO_HOME="${install_directory}" \
            OTEL_DOTNET_AUTO_LOG_DIRECTORY="${log_directory}" \
            OTEL_SERVICE_NAME="beacon-release-validation" \
            OTEL_TRACES_EXPORTER=none \
            OTEL_METRICS_EXPORTER=none \
            OTEL_LOGS_EXPORTER=none \
            "${install_directory}/instrument.sh" ./bin/Release/net8.0/publish/testapp
          sh "${install_directory}/uninstall.sh"
          test ! -e "${install_directory}"

  musl-installer:
    name: Shell installer on ${{ matrix.target }}
    if: startsWith(github.event.release.tag_name, 'v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - machine: ubuntu-24.04
            target: linux-musl-x64
          - machine: ubuntu-24.04-arm
            target: linux-musl-arm64
    runs-on: ${{ matrix.machine }}
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Verify published installer and archive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="beacon-dotnet-auto-${version}-${TARGET}.zip"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern "${archive}" \
            --pattern otel-dotnet-auto-install.sh \
            --dir "${RUNNER_TEMP}/beacon-release"
          for file in "${RUNNER_TEMP}/beacon-release/${archive}" "${RUNNER_TEMP}/beacon-release/otel-dotnet-auto-install.sh"; do
            gh attestation verify "${file}" \
              --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/beacon-release.yml" \
              --source-ref "refs/tags/${RELEASE_TAG}"
          done

      - name: Install and run inside Alpine
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="beacon-dotnet-auto-${version}-${TARGET}.zip"
          docker build -t beacon-release-alpine -f docker/alpine.dockerfile .
          docker run --rm \
            -e "RELEASE_TAG=${RELEASE_TAG}" \
            -e "ARCHIVE=${archive}" \
            -v "${RUNNER_TEMP}/beacon-release:/release:ro" \
            beacon-release-alpine /bin/sh -c '
              set -e
              apk add --no-cache unzip
              mkdir /tmp/testapp
              cd /tmp/testapp
              printf "%s\n" "<Project />" > Directory.Build.props
              dotnet new console --framework net8.0
              dotnet publish --framework net8.0 --configuration Release
              VERSION="$RELEASE_TAG" \
                LOCAL_PATH="/release/$ARCHIVE" \
                OTEL_DOTNET_AUTO_HOME=/tmp/beacon-dotnet-auto \
                SKIP_RELEASE_VERIFICATION=true \
                sh /release/otel-dotnet-auto-install.sh
              test -f /tmp/beacon-dotnet-auto/BEACON-METADATA.json
              mkdir -p /tmp/beacon-dotnet-auto-logs
              OTEL_DOTNET_AUTO_HOME=/tmp/beacon-dotnet-auto \
                OTEL_DOTNET_AUTO_LOG_DIRECTORY=/tmp/beacon-dotnet-auto-logs \
                OTEL_SERVICE_NAME=beacon-release-validation \
                OTEL_TRACES_EXPORTER=none \
                OTEL_METRICS_EXPORTER=none \
                OTEL_LOGS_EXPORTER=none \
                /tmp/beacon-dotnet-auto/instrument.sh ./bin/Release/net8.0/publish/testapp
              sh /tmp/beacon-dotnet-auto/uninstall.sh
              test ! -e /tmp/beacon-dotnet-auto
            '
